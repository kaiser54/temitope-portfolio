<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9f9f9" />
    <script>
      // Apply a saved theme before first paint. Default is light; "system" follows the OS.
      try {
        var t = localStorage.getItem('theme')
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.dataset.theme = 'dark'
          document.querySelector('meta[name="theme-color"]').content = '#090909'
        }
      } catch {}
    </script>
    <meta
      name="description"
      content="Temitope Agboola — frontend and product engineer in Lagos building fintech, commerce and real-time products."
    />
    <!-- Icons: /favicon.ico for fetchers that ask for it (16/32/48), PNGs at multiples of 48px for Google,
         a manifest for installs. Regenerate with `pnpm icons`. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Temitope Agboola</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
