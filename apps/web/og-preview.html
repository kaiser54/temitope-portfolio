<!doctype html>
<!--
  Share-image (Open Graph) variants, previewed the way messengers show them.
  Dev only: open http://localhost:5173/og-preview.html while `pnpm dev` runs (not part of the build).
  Render one variant at full size with ?only=<id>&theme=light|dark  (used to export public/og.png).
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Share image variants</title>
    <style>
      :root {
        --name: 'Temitope Agboola';
        --ink: #2a2a2a;
        --ink-2: #8d8d8d;
        --ink-3: #b2b2b2;
        --canvas: #f9f9f9;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      * { box-sizing: border-box; margin: 0; }
      body { background: #ececec; color: #2a2a2a; padding: 40px 32px 80px; }
      header.page { max-width: 1240px; margin: 0 auto 32px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: baseline; justify-content: space-between; }
      header.page h1 { font-size: 20px; font-weight: 600; }
      header.page p { color: #666; font-size: 14px; max-width: 640px; line-height: 1.5; }
      .controls { display: flex; gap: 8px; }
      .controls button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid #d0d0d0; background: #fff; cursor: pointer; }
      .controls button[aria-pressed='true'] { background: #2a2a2a; color: #fff; border-color: #2a2a2a; }

      section.variant { max-width: 1240px; margin: 0 auto 40px; background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 1px 2px rgb(0 0 0 / .05); }
      section.variant > h2 { font-size: 16px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
      section.variant > h2 span { font-weight: 400; color: #777; font-size: 14px; }
      .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 20px; margin-top: 18px; align-items: start; }
      .mock { display: flex; flex-direction: column; gap: 8px; }
      .mock > small { font-size: 12px; color: #888; }

      /* frames — each holds a scaled 1200×630 card */
      .frame { position: relative; width: 100%; aspect-ratio: 1200 / 630; overflow: hidden; }
      .frame > .og { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
      .wa { background: #0b141a; border-radius: 10px; padding: 4px; }
      .wa .frame { border-radius: 8px 8px 0 0; }
      .wa .meta { background: #1f2c2a; color: #e9edef; padding: 8px 10px; border-radius: 0 0 8px 8px; font-size: 13px; }
      .wa .meta b { display: block; font-weight: 600; }
      .wa .meta i { font-style: normal; color: #8696a0; font-size: 12px; }
      .im { border-radius: 18px; overflow: hidden; background: #e9e9eb; }
      .im .meta { padding: 8px 12px; font-size: 13px; }
      .im .meta b { display: block; font-weight: 600; }
      .im .meta i { font-style: normal; color: #6e6e73; font-size: 12px; }
      .x { border-radius: 16px; overflow: hidden; border: 1px solid #cfd9de; position: relative; }
      .x .tag { position: absolute; left: 10px; bottom: 10px; background: rgb(0 0 0 / .77); color: #fff; font-size: 12px; padding: 1px 6px; border-radius: 4px; }
      .thumb { width: 96px; height: 96px; border-radius: 8px; overflow: hidden; position: relative; }
      .thumb .og { position: absolute; top: 0; transform-origin: 0 0; }

      /* ============== the cards (authored at 1200×630) ============== */
      .og { width: 1200px; height: 630px; position: relative; overflow: hidden; background: var(--canvas); color: var(--ink); }
      .og.dark { --canvas: #090909; --ink: #f5f5f5; --ink-2: #b2b2b2; --ink-3: #8d8d8d; }
      .og img.avatar { border-radius: 50%; object-fit: cover; display: block; box-shadow: 0 0 0 1px rgb(0 0 0 / .06), 0 12px 32px -12px rgb(0 0 0 / .35); }
      .og.dark img.avatar { box-shadow: 0 0 0 1px rgb(255 255 255 / .1), 0 12px 32px -12px rgb(0 0 0 / .8); }
      .glow { position: absolute; border-radius: 50%; pointer-events: none; }

      /* A — Big type: two-line name/role, large enough to survive a phone-sized preview */
      .vA { display: flex; flex-direction: column; justify-content: center; padding: 0 96px; gap: 22px; }
      .vA .who { display: flex; align-items: center; gap: 22px; }
      .vA .who img { width: 88px; height: 88px; }
      .vA .who span { font-size: 34px; color: var(--ink-2); }
      .vA h1 { font-size: 92px; line-height: 1.02; letter-spacing: -0.035em; font-weight: 600; }
      .vA h1 em { font-style: normal; color: var(--ink-2); font-weight: 500; }
      .vA .glow { width: 900px; height: 520px; right: -260px; bottom: -330px; filter: blur(90px); opacity: .55;
                  background: radial-gradient(closest-side, #8b7bff, #c084fc 40%, #fb7185 70%, transparent); }

      /* B — Split: big portrait left, text right */
      .vB { display: grid; grid-template-columns: 300px 1fr; align-items: center; gap: 64px; padding: 0 96px; }
      .vB img { width: 300px; height: 300px; }
      .vB h1 { font-size: 76px; line-height: 1.04; letter-spacing: -0.03em; font-weight: 600; }
      .vB p.role { font-size: 40px; color: var(--ink-2); margin-top: 14px; letter-spacing: -0.015em; }
      .vB p.mail { font-size: 28px; color: var(--ink-3); margin-top: 28px; }
      .vB .glow { width: 760px; height: 760px; left: -280px; bottom: -420px; filter: blur(100px); opacity: .5;
                  background: radial-gradient(closest-side, #60a5fa, #a78bfa 45%, #f472b6 75%, transparent); }

      /* C — Centered, compact: original layout, but everything ~1.6× and a tighter glow */
      .vC { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px; text-align: center; padding: 0 60px; }
      .vC img { width: 140px; height: 140px; }
      .vC h1 { font-size: 76px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 600; }
      .vC p.role { font-size: 42px; color: var(--ink-2); margin-top: -12px; letter-spacing: -0.015em; }
      .vC .glow { width: 1300px; height: 300px; left: -50px; bottom: -210px; filter: blur(80px); opacity: .6;
                  background: linear-gradient(90deg, #8b7bff, #c084fc, #fb7185, #fdba74); }

      /* D — Glow card: gradient field, white card floating in the middle */
      .vD { display: grid; place-items: center; }
      .vD .field { position: absolute; inset: 0; filter: blur(60px) saturate(1.1); opacity: .9;
                   background: radial-gradient(40% 60% at 15% 85%, #a78bfa, transparent), radial-gradient(40% 60% at 50% 100%, #fb7185, transparent),
                               radial-gradient(40% 60% at 88% 80%, #fdba74, transparent), radial-gradient(50% 50% at 80% 10%, #93c5fd, transparent); }
      .vD .card { position: relative; background: rgb(255 255 255 / .82); backdrop-filter: blur(20px); border-radius: 36px; padding: 52px 64px;
                  display: flex; align-items: center; gap: 40px; box-shadow: 0 1px 0 rgb(255 255 255 / .8) inset, 0 30px 80px -30px rgb(0 0 0 / .35); }
      .vD.dark .card { background: rgb(20 20 20 / .78); box-shadow: 0 1px 0 rgb(255 255 255 / .08) inset, 0 30px 80px -30px rgb(0 0 0 / .8); }
      .vD img { width: 168px; height: 168px; }
      .vD h1 { font-size: 66px; line-height: 1.05; letter-spacing: -0.03em; font-weight: 600; }
      .vD p.role { font-size: 36px; color: var(--ink-2); margin-top: 10px; }
      .vD p.mail { font-size: 26px; color: var(--ink-3); margin-top: 18px; }

      /* E — Minimal wordmark: name only, huge; glow strip along the bottom edge */
      .vE { display: flex; flex-direction: column; justify-content: flex-end; padding: 0 96px 120px; }
      .vE img { width: 96px; height: 96px; position: absolute; top: 88px; left: 96px; }
      .vE h1 { font-size: 120px; line-height: .98; letter-spacing: -0.045em; font-weight: 600; }
      .vE p.role { font-size: 38px; color: var(--ink-2); margin-top: 22px; }
      .vE p.mail { position: absolute; top: 118px; right: 96px; font-size: 26px; color: var(--ink-3); }
      .vE .glow { width: 1400px; height: 160px; left: -100px; bottom: -110px; filter: blur(50px); opacity: .85;
                  background: linear-gradient(90deg, #60a5fa, #a78bfa, #f472b6, #fb923c); }

      /* F — Quiet: modelled on the reference — white, one grey line, nothing loud.
         Small photo above, email below, a faint glow resting on the bottom edge. */
      .vF { --canvas: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px; text-align: center; }
      .vF.dark { --canvas: #0b0b0b; }
      .vF img { width: 92px; height: 92px; }
      .vF h1 { font-size: 60px; font-weight: 400; letter-spacing: -0.015em; color: #8e8e8e; line-height: 1.18; }
      .vF.dark h1 { color: #9a9a9a; }
      .vF p.mail { font-size: 30px; color: #b8b8b8; margin-top: -8px; letter-spacing: -0.005em; }
      .vF.dark p.mail { color: #6b6b6b; }
      .vF .glow { width: 1000px; height: 220px; left: 100px; bottom: -150px; filter: blur(70px); opacity: .45;
                  background: linear-gradient(90deg, #a5b4fc, #d8b4fe 35%, #fbcfe8 65%, #fed7aa); }
      .vF.dark .glow { opacity: .3; }

      /* G — Minimal: two grey lines on white. Nothing else.
         H — Minimal + photo: the same, with a small photo above. */
      .vG, .vH { --canvas: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; text-align: center; }
      .vG.dark, .vH.dark { --canvas: #0b0b0b; }
      .vG h1, .vH h1 { font-size: 58px; font-weight: 400; letter-spacing: -0.015em; color: #8e8e8e; line-height: 1.2; }
      .vG.dark h1, .vH.dark h1 { color: #8a8a8a; }
      .vH img { width: 84px; height: 84px; box-shadow: none; }

      /* I — Corner note: soft grey card, mostly empty; name + two-line statement, small, bottom-left. */
      /* site greyscale (Quality Labs tokens): canvas / Text-default / Text-secondary */
      .vI { --canvas: #f9f9f9; --ink: #595959; --ink-2: #8d8d8d; } /* name: Grey-300, softer than Text-default */
      .vI.dark { --canvas: #090909; --ink: #f5f5f5; --ink-2: #b2b2b2; }
      .vI .note { position: absolute; left: 80px; bottom: 84px; }
      /* name and statement share one size; weight alone separates them, as in the reference */
      .vI .note b { display: block; font-size: 58px; font-weight: 500; color: var(--ink); }
      .vI .note p { margin-top: 18px; font-size: 48px; font-weight: 400; color: var(--ink-2); }

      /* full-size render mode (?only=…) */
      body.only { padding: 0; background: transparent; }
      body.only .og { position: fixed; left: 0; top: 0; }
    </style>
  </head>
  <body>
    <header class="page">
      <div>
        <h1>Share image variants</h1>
        <p>Each card is authored at 1200×630 and shown how WhatsApp, iMessage and X display it, plus the small square
          thumbnail some chats use. Pick one and it gets exported to <code>public/og.png</code>.</p>
      </div>
      <div class="controls" role="group" aria-label="Theme">
        <button data-theme="light" aria-pressed="true">Light</button>
        <button data-theme="dark" aria-pressed="false">Dark</button>
      </div>
    </header>
    <main id="variants"></main>

    <script>
      const AVATAR = '/og-avatar.jpg'
      const NAME = 'Temitope Agboola'
      const ROLE = 'Frontend & Product Engineer'
      const MAIL = 'agboolatemitope070@gmail.com'
      const TITLE = 'Temitope Agboola — Frontend & Product Engineer'
      const HOST = 'temitope-portfolio'

      const VARIANTS = {
        I: { label: 'Corner note', note: 'Soft grey, mostly empty; name and a two-line statement, small, bottom-left. (Exported to public/og.png)',
             html: `<div class="note"><b>${NAME}</b>
                    <p>I build frontends for products that<br>move money and run businesses.</p></div>` },
        G: { label: 'Minimal', note: 'Two regular-weight grey lines on white. Nothing else.',
             html: `<h1>${NAME},<br>${ROLE}</h1>` },
        H: { label: 'Minimal + photo', note: 'The same two lines, with a small photo above.',
             html: `<img class="avatar" src="${AVATAR}" alt=""><h1>${NAME},<br>${ROLE}</h1>` },
        F: { label: 'Quiet (like the reference)', note: 'White, name and role on two regular-weight grey lines, small photo and email, faint glow on the bottom edge.',
             html: `<div class="glow"></div><img class="avatar" src="${AVATAR}" alt="">
                    <h1>${NAME},<br>${ROLE}</h1><p class="mail">${MAIL}</p>` },
        A: { label: 'Big type', note: 'Name and role as a large two-line headline; avatar + email in a small byline.',
             html: `<div class="glow"></div>
                    <div class="who"><img class="avatar" src="${AVATAR}" alt=""><span>${MAIL}</span></div>
                    <h1>${NAME}<br><em>${ROLE}</em></h1>` },
        B: { label: 'Split portrait', note: 'Large photo on the left, name / role / email on the right.',
             html: `<div class="glow"></div><img class="avatar" src="${AVATAR}" alt="">
                    <div><h1>${NAME}</h1><p class="role">${ROLE}</p><p class="mail">${MAIL}</p></div>` },
        C: { label: 'Centered, scaled up', note: 'The current layout, about 1.6× bigger, with a slimmer glow at the bottom.',
             html: `<div class="glow"></div><img class="avatar" src="${AVATAR}" alt="">
                    <div><h1>${NAME}</h1></div><p class="role">${ROLE}</p>` },
        D: { label: 'Glow card', note: 'Full gradient field with a frosted card holding photo, name, role and email.',
             html: `<div class="field"></div>
                    <div class="card"><img class="avatar" src="${AVATAR}" alt="">
                    <div><h1>${NAME}</h1><p class="role">${ROLE}</p><p class="mail">${MAIL}</p></div></div>` },
        E: { label: 'Wordmark', note: 'Name huge at the bottom-left, glow strip along the bottom edge, details in the corners.',
             html: `<div class="glow"></div><img class="avatar" src="${AVATAR}" alt=""><p class="mail">${MAIL}</p>
                    <h1>${NAME}</h1><p class="role">${ROLE}</p>` },
      }

      const params = new URLSearchParams(location.search)
      const card = (id, theme) => `<div class="og v${id} ${theme === 'dark' ? 'dark' : ''}">${VARIANTS[id].html}</div>`

      // Export mode: one card, full size, nothing else on the page.
      if (params.has('only')) {
        document.body.className = 'only'
        document.body.innerHTML = card(params.get('only'), params.get('theme') || 'light')
      } else {
        let theme = 'light'
        const scaleInto = () => {
          document.querySelectorAll('.frame').forEach((f) => {
            f.querySelector('.og').style.transform = `scale(${f.clientWidth / 1200})`
          })
          document.querySelectorAll('.thumb').forEach((t) => {
            const s = 96 / 630 // square crop: fit height, centre horizontally
            const og = t.querySelector('.og')
            og.style.transform = `scale(${s})`
            og.style.left = `${(96 - 1200 * s) / 2}px`
          })
        }
        const render = () => {
          document.getElementById('variants').innerHTML = Object.entries(VARIANTS).map(([id, v]) => `
            <section class="variant">
              <h2>${id} · ${v.label} <span>${v.note}</span></h2>
              <div class="row">
                <div class="mock"><small>WhatsApp</small>
                  <div class="wa"><div class="frame">${card(id, theme)}</div>
                  <div class="meta"><b>${TITLE}</b><i>${HOST}</i></div></div></div>
                <div class="mock"><small>iMessage</small>
                  <div class="im"><div class="frame">${card(id, theme)}</div>
                  <div class="meta"><b>${TITLE}</b><i>${HOST}</i></div></div></div>
                <div class="mock"><small>X / Twitter</small>
                  <div class="x"><div class="frame">${card(id, theme)}</div><span class="tag">${HOST}</span></div></div>
                <div class="mock"><small>Square thumbnail</small>
                  <div class="thumb">${card(id, theme)}</div></div>
              </div>
            </section>`).join('')
          scaleInto()
        }
        document.querySelectorAll('.controls button').forEach((b) =>
          b.addEventListener('click', () => {
            theme = b.dataset.theme
            document.querySelectorAll('.controls button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)))
            render()
          }),
        )
        addEventListener('resize', scaleInto)
        render()
      }
    </script>
  </body>
</html>
